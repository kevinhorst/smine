name: ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure git for shell tests
        run: git config --global init.defaultBranch main
      - name: Run tests
        run: make test

  # Build jobs only stage artifacts; nothing is published until every artifact
  # exists — the release is atomic, attached in one shot by the publish job.
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release binaries
        run: |
          make build-release GOOS=darwin GOARCH=arm64 VERSION="${GITHUB_REF_NAME#v}"
          make build-release GOOS=darwin GOARCH=amd64 VERSION="${GITHUB_REF_NAME#v}"
      - name: Build windows payload
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/bin/verifiers
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H=windowsgui -X main.version=$VERSION" -o dist/bin/configserver.exe ./cmd/configserver
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H=windowsgui" -o dist/bin/routinewrap.exe ./cmd/routinewrap
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/bin/acdsl.exe ./cmd/acdsl
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/bin/rules.exe ./cmd/rules
          for d in cmd/acdsl/verifiers/*/; do
            name=$(basename "$d")
            GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o "dist/bin/verifiers/$name.exe" "./$d"
          done
      - name: Fetch third-party payloads (pinned)
        run: |
          curl -fsSL -o dist/jq.exe https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          curl -fsSL -o dist/peek-mcp.exe https://github.com/kevinhorst/peek-mcp/releases/download/v1.2.2/peek-mcp-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-payload
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: bin/release/

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-payload
          path: dist
      - name: Stage source tree
        shell: pwsh
        run: |
          git archive --format=zip -o src.zip HEAD
          Expand-Archive src.zip -DestinationPath dist\srctree
      - name: Compile installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          iscc /DAppVersion=$version installer\windows\smine.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/smine-setup.exe

  publish:
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: bin/release
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/release/*
            dist/smine-setup.exe
          generate_release_notes: true
