name: ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure git for shell tests
        run: git config --global init.defaultBranch main
      - name: Run tests
        run: make test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release binaries
        run: |
          make build-release GOOS=darwin GOARCH=arm64 VERSION="${GITHUB_REF_NAME#v}"
          make build-release GOOS=darwin GOARCH=amd64 VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/release/*
          generate_release_notes: true
