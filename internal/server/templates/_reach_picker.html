{{define "_reach_picker.html"}}
<details class="reach-picker">
  <summary>{{.Label}}</summary>
  <div class="reach-options">
    {{range .Options}}<label><input type="checkbox" name="reach" value="{{.Value}}"{{if .Selected}} checked{{end}}{{if $.Form}} form="{{$.Form}}"{{end}}> {{.Label}}</label>{{end}}
  </div>
</details>
{{end}}
