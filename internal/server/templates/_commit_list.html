{{define "_commit_list.html"}}
<div id="commit-list">
  <h2>{{.Class}} — {{.Branch}}</h2>
  {{if .Commits}}
  <table class="md-body checklist-table">
    <tbody>
      {{range .Commits}}
      <tr>
        <td><code>{{.Line}}</code></td>
      </tr>
      {{end}}
    </tbody>
  </table>
  {{else}}
  <div class="empty">No commits.</div>
  {{end}}
</div>
{{end}}
