{{define "_commit_list.html"}}
<div id="commit-list">
  <h2>{{.Class}} — {{.Branch}}</h2>
  {{if .Commits}}
  <table class="md-body checklist-table">
    <tbody>
      {{range .Commits}}
      <tr>
        <td><code>{{.Line}}</code></td>
        {{if eq $.Class "unpicked"}}
        <td>
          <form hx-post="/repos/{{pathEscape $.Repo}}/cherry-pick" hx-target="#op-result">
            <input type="hidden" name="commit" value="{{.Sha}}">
            <button type="submit">cherry-pick</button>
          </form>
        </td>
        {{end}}
      </tr>
      {{end}}
    </tbody>
  </table>
  {{else}}
  <div class="empty">No commits.</div>
  {{end}}
</div>
{{end}}
