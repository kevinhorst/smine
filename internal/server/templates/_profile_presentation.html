{{define "_profile_presentation.html"}}
{{/* One form, swapped in place: the save answers with it and its notice beside the Save button. */}}
<form id="profile-presentation-form" class="configure-form" hx-post="/profile/presentation" hx-target="#profile-presentation-form" hx-swap="outerHTML">
  <textarea name="presentation_content" rows="16">{{.PresentationContent}}</textarea>
  <div class="card-row">
    <button type="submit">{{t "Save"}}</button>
    {{if .Notice}}<span class="badge badge-ok">Ok</span> <span class="label">{{t .Notice}}</span>{{end}}
  </div>
</form>
{{end}}
