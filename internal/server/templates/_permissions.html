{{define "_permissions.html"}}
<span id="ovr-permissions" hx-swap-oob="true">{{if .Overridden}}<span class="badge badge-action" title="differs from the repo fragment">overridden</span>{{end}}</span>
<div id="permissions-section">
  <h2 class="first">Permissions — Allow</h2>
  {{if not .Allow}}<div class="empty">None</div>{{end}}
  {{range .Allow}}
  <div class="card {{if not .Enabled}}card-disabled{{end}}">
    <span class="label">{{.Value}}</span>
    <label class="toggle">
      <input type="checkbox" {{if .Enabled}}checked{{end}}
             hx-post="/api/permissions/{{.List}}/{{.Index}}/toggle"
             hx-target="#permissions-section" hx-swap="outerHTML">
      <span class="slider"></span>
    </label>
  </div>
  {{end}}
  <h2>Permissions — Ask</h2>
  {{if not .Ask}}<div class="empty">None</div>{{end}}
  {{range .Ask}}
  <div class="card {{if not .Enabled}}card-disabled{{end}}">
    <span class="label">{{.Value}}</span>
    <label class="toggle">
      <input type="checkbox" {{if .Enabled}}checked{{end}}
             hx-post="/api/permissions/{{.List}}/{{.Index}}/toggle"
             hx-target="#permissions-section" hx-swap="outerHTML">
      <span class="slider"></span>
    </label>
  </div>
  {{end}}
</div>
{{end}}
