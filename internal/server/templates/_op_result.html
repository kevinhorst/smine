{{define "_op_result.html"}}
<div id="op-result">
  {{if .Error}}
  <div class="card card-error"><span class="badge badge-error">Failed</span> <span class="label">{{.Subject}}: {{.Error}}</span></div>
  {{else}}
  <div class="card"><span class="badge badge-ok">Ok</span> <span class="label">{{.Subject}}</span></div>
  {{end}}
  {{if .Output}}
  <pre class="file-view">{{.Output}}</pre>
  {{end}}
</div>
{{end}}
