{{template "head" .}}
{{template "nav" .}}
<h1>Tools</h1>
<div class="card">
  <form hx-post="/tools/prune-jetbrains" hx-target="#op-result">
    <button type="submit">Prune JetBrains recent projects</button>
    <label><input type="checkbox" name="dry-run" checked> dry run</label>
    <label><input type="checkbox" name="force"> force</label>
  </form>
</div>
<div class="card">
  <span class="badge badge-action">Experimental</span> <span class="label">Secret scan (WIP) — read-only, raw JSON output</span>
  {{if .RepoNames}}
  <form hx-post="/tools/secretscan" hx-target="#op-result">
    {{template "_repo_select.html" .RepoNames}}
    <button type="submit">Scan repo secrets</button>
    <label><input type="checkbox" name="history"> include git history</label>
  </form>
  {{else}}
  <span class="label">no repos registered</span>
  {{end}}
</div>
<div id="op-result"></div>
{{template "foot" .}}
