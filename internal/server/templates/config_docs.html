{{template "head" .}}
{{template "nav" .}}
<h1>Config</h1>
{{template "_config_tabs" .}}
{{range .Entries}}
<div class="card">
  <span class="label">
    <strong>{{.Key}}</strong>
    <span class="meta">{{.Type}}{{if .Values}} — {{range .Values}}{{.}} {{end}}{{end}}</span>
    {{if .Explanation}}<br><span class="meta explanation">{{.Explanation}}</span>{{end}}
  </span>
  {{if .Source}}<a class="meta" href="{{.Source}}" target="_blank" rel="noopener">source</a>{{end}}
</div>
{{end}}
{{template "foot" .}}
